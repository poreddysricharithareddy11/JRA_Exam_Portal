services:
  exam-portal:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
      COOKIE_SECURE: "false"   # set to "true" once served over HTTPS
    volumes:
      - examdata:/data
    restart: unless-stopped
volumes:
  examdata:
